<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorter - Password Required</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="toast-container"></div>
    <div id="auth-view" class="view">
        <div class="glass-card auth-card">
            <h1 class="logo">Shorter<span class="dot">.</span></h1>
            <p class="subtitle">This link is password protected.</p>
            <form id="password-form">
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter password to unlock">
                </div>
                <button type="submit" class="btn primary full-width" id="unlock-submit">Unlock Link</button>
            </form>
        </div>
    </div>
    <script>
        const shortCode = window.location.pathname.substring(1);
        const form = document.getElementById('password-form');
        const submitBtn = document.getElementById('unlock-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Unlocking...';
                
                const res = await fetch(`/api/v1/urls/${shortCode}/unlock`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.error?.message || 'Invalid password');
                }

                if (data.original_url) {
                    window.location.href = data.original_url;
                }
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Unlock Link';
                
                // Show toast manually
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'toast error';
                toast.textContent = err.message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.animation = 'toastSlideIn 0.3s ease reverse';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        });
    </script>
</body>
</html>
